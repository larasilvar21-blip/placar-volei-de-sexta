function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function standings(){const rows=data.names.map((name,i)=>({name,i,j:0,v:0,d:0,pro:0,contra:0,pts:0}));data.games.filter(g=>g.done).forEach(g=>{const a=rows[g.a],b=rows[g.b],sa=Number(g.sa),sb=Number(g.sb);a.j++;b.j++;a.pro+=sa;a.contra+=sb;b.pro+=sb;b.contra+=sa;if(sa>sb){a.v++;b.d++;a.pts+=3}else{b.v++;a.d++;b.pts+=3}});return rows.sort((a,b)=>b.pts-a.pts||b.v-a.v||(b.pro-b.contra)-(a.pro-a.contra)||b.pro-a.pro||a.i-b.i)}function table(){return `<table><thead><tr><th>#</th><th>EQUIPE</th><th class="num">J</th><th class="num">V</th><th class="num">D</th><th class="num">PTS</th><th class="num">SALDO</th></tr></thead><tbody>${standings().map((r,i)=>`<tr class="${i<4?'highlight':''}"><td class="rank">${i+1}º</td><td><strong>${esc(r.name)}</strong></td><td class="num">${r.j}</td><td class="num">${r.v}</td><td class="num">${r.d}</td><td class="num"><strong>${r.pts}</strong></td><td class="num">${r.pro-r.contra>0?'+':''}${r.pro-r.contra}</td></tr>`).join('')}</tbody></table>`}function gameText(g){return `${esc(data.names[g.a])} ${g.done?`${g.sa} × ${g.sb}`:'×'} ${esc(data.names[g.b])}`}
function currentGame(){return data.games[data.next]&&!data.games[data.next].done?data.games[data.next]:data.games.find(g=>!g.done)}

  }

}

function qualifiers(){return data.games.every(g=>g.done)?standings().slice(0,4):null}
function knockoutTeams(stage){const q=qualifiers();if(!q)return null;if(stage==='semi1')return [q[0].i,q[3].i];if(stage==='semi2')return [q[1].i,q[2].i];const a=data.knockout.semi1,b=data.knockout.semi2;if(!a.done||!b.done)return null;const t1=knockoutTeams('semi1'),t2=knockoutTeams('semi2');return stage==='third'?[a.sa<a.sb?t1[0]:t1[1],b.sa<b.sb?t2[0]:t2[1]]:[a.sa>a.sb?t1[0]:t1[1],b.sa>b.sb?t2[0]:t2[1]]}

function knockoutControls(stage){const labels={semi1:'Semifinal 1',semi2:'Semifinal 2',third:'Disputa do 3º lugar',final:'Final'},g=data.knockout[stage],teams=knockoutTeams(stage);return `<div class="ko-control"><strong>Jogo ${stage==='semi1'?16:stage==='semi2'?17:stage==='third'?18:19} · ${labels[stage]}</strong><div class="game"><div class="team">${teams?esc(data.names[teams[0]]):'A definir'}</div><input type="number" min="0" max="99" data-ko="${stage}-a" value="${g.sa}" ${!teams?'disabled':''}><span>×</span><input type="number" min="0" max="99" data-ko="${stage}-b" value="${g.sb}" ${!teams?'disabled':''}><div class="team">${teams?esc(data.names[teams[1]]):'A definir'}</div><button data-ko-finish="${stage}" class="${g.done?'secondary':''}" ${!teams?'disabled':''}>${g.done?'Editar resultado':'Finalizar partida'}</button></div></div>`}

s devem estar conectados à internet e autenticados.</div></section><section class="panel"><h2>Nomes das equipes</h2>${data.names.map((n,i)=>`<label>Equipe ${i+1}<input data-name="${i}" value="${esc(n)}" maxlength="35"></label>`).join('')}<button id="saveNames">Salvar nomes</button><p class="muted">Edite os nomes antes ou durante os jogos. A classificação é recalculada automaticamente.</p></section></div><section class="panel"><h2>Resultados das partidas</h2><p class="muted">Informe os pontos de cada time e finalize. A classificação muda automaticamente.</p>${data.games.map((g,i)=>`<div class="game"><div class="team">${esc(data.names[g.a])}</div><input type="number" min="0" max="99" inputmode="numeric" data-score="${i}-a" value="${g.sa}" aria-label="Pontos de ${esc(data.names[g.a])}"><span>×</span><input type="number" min="0" max="99" inputmode="numeric" data-score="${i}-b" value="${g.sb}" aria-label="Pontos de ${esc(data.names[g.b])}"><div class="team">${esc(data.names[g.b])}<div class="status">Jogo ${i+1} • ${g.done?'Finalizado':'Pendente'}</div></div><button class="${g.done?'secondary':''}" data-finish="${i}">${g.done?'Editar resultado':'Finalizar partida'}</button></div>`).join('')}</section><section class="panel"><h2>Semifinais, 3º lugar e final</h2><p class="muted">Semifinais: 1º × 4º e 2º × 3º. Os perdedores disputam o 3º lugar, e os vencedores disputam a final. As equipes aparecem quando os 15 jogos da fase classificatória forem concluídos.</p><div class="ko-grid">${knockoutCard('semi1')}${knockoutCard('semi2')}${knockoutCard('third')}${knockoutCard('final')}</div>${knockoutControls('semi1')}${knockoutControls('semi2')}${knockoutControls('third')}${knockoutControls('final')}${winner()?`<div class="champion">🏆 CAMPEÃO: ${esc(winner())} · VICE: ${esc(runnerUp())}</div>`:''}${thirdPlace()?`<div class="champion">🥉 3º LUGAR: ${esc(thirdPlace())}</div>`:''}</section><section class="panel"><h2>Próxima partida na TV</h2><label>Selecione o confronto a destacar<select id="next" style="width:100%;padding:12px;background:#07182f;color:#fff;border:1px solid #58728c;border-radius:8px">${data.games.map((g,i)=>`<option value="${i}" ${data.next===i?'selected':''}>Jogo ${i+1}: ${esc(data.names[g.a])} × ${esc(data.names[g.b])}</option>`).join('')}</select></label><div class="actions"><button class="secondary" id="export">Exportar backup</button><button class="secondary" id="import">Importar backup</button><button class="danger" id="reset">Zerar torneio</button></div><input id="importFile" type="file" accept="application/json" hidden></section>`;document.getElementById('saveNames').onclick=()=>{data.names=[...document.querySelectorAll('[data-name]')].map(x=>x.value.trim()||'Equipe');save()};document.querySelectorAll('[data-finish]').forEach(btn=>btn.onclick=()=>{let i=+btn.dataset.finish,g=data.games[i];if(g.done){if(qualifiers()&& !confirm('Editar a classificatória pode alterar o chaveamento. Os resultados da fase eliminatória serão apagados. Continuar?'))return;data.knockout=fresh().knockout;g.done=false;save();return}const a=document.querySelector(`[data-score="${i}-a"]`).value,b=document.querySelector(`[data-score="${i}-b"]`).value;if(a===''||b===''||+a===+b||+a<0||+b<0||+a>99||+b>99){alert('Informe dois placares válidos, diferentes e entre 0 e 99.');return}g.sa=+a;g.sb=+b;g.done=true;data.knockout=fresh().knockout;const nextIndex=data.games.findIndex(x=>!x.done);if(nextIndex!==-1)data.next=nextIndex;save()});document.querySelectorAll('[data-ko-finish]').forEach(btn=>btn.onclick=()=>{const stage=btn.dataset.koFinish,g=data.knockout[stage];if(g.done){if(stage==='semi1'||stage==='semi2'){if((data.knockout.final.done||data.knockout.third.done)&&!confirm('Editar esta semifinal apagará os resultados do 3º lugar e da final. Continuar?'))return;data.knockout.final={sa:'',sb:'',done:false};data.knockout.third={sa:'',sb:'',done:false}}g.done=false;save();return}if(!knockoutTeams(stage))return;if(stage==='semi2'&&!data.knockout.semi1.done){alert('Finalize a semifinal 1 primeiro.');return}if(stage==='final'&&!data.knockout.third.done){alert('Finalize a disputa do 3º lugar antes da final.');return}const a=document.querySelector(`[data-ko="${stage}-a"]`).value,b=document.querySelector(`[data-ko="${stage}-b"]`).value;if(a===''||b===''||+a===+b||+a<0||+b<0||+a>99||+b>99){alert('Informe placares diferentes entre 0 e 99.');return}g.sa=+a;g.sb=+b;g.done=true;save()});document.getElementById('next').onchange=e=>{data.next=+e.target.value;save()};document.getElementById('reset').onclick=()=>{if(confirm('Apagar TODOS os nomes e resultados? Esta ação não pode ser desfeita.')){data=fresh();save()}};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-placar-volei.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(obj.names?.length!==6||obj.games?.length!==15)throw Error();data=obj;save()}catch(x){alert('Arquivo de backup inválido.')}}}
